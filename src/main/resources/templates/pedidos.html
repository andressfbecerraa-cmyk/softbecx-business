<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - SOFTBECX</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            min-height: 100vh;
        }

        /* BARRA LATERAL */

        .sidebar {
            width: 250px;
            background: #0b1f3a;
            color: white;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #ffffff;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 13px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #173b6c;
        }

        .menu a.activo {
            background: #1e4f8a;
        }

        /* CONTENIDO */

        .contenido {
            flex: 1;
            padding: 35px;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            color: #0b1f3a;
        }

        .usuario {
            background: white;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* TARJETAS */

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .tarjeta h2 {
            margin-bottom: 20px;
            color: #0b1f3a;
        }

        /* FORMULARIO */

        .formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .campo input,
        .campo select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .botones {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-guardar {
            background: #0b1f3a;
            color: white;
        }

        .btn-guardar:hover {
            background: #173b6c;
        }

        .btn-cancelar {
            background: #ddd;
            color: #333;
        }

        .btn-cancelar:hover {
            background: #ccc;
        }

        /* TABLA */

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0b1f3a;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .acciones {
            white-space: nowrap;
        }

        .btn-editar {
            background: #ffc107;
            color: #222;
            margin-right: 5px;
        }

        .btn-ver {
            background: #0b1f3a;
            color: white;
            margin-right: 5px;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
        }

        /* ESTADOS */

        .estado {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .pendiente {
            background: #fff3cd;
            color: #856404;
        }

        .confirmado {
            background: #d1ecf1;
            color: #0c5460;
        }

        .enviado {
            background: #cce5ff;
            color: #004085;
        }

        .entregado {
            background: #d4edda;
            color: #155724;
        }

        /* DETALLE */

        .detalle-pedido {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .detalle-pedido h3 {
            color: #0b1f3a;
            margin-bottom: 15px;
        }

        .detalle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detalle-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .detalle-item strong {
            display: block;
            color: #555;
            margin-bottom: 5px;
        }

        .detalle-item span {
            color: #111;
        }

        .mensaje {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 900px) {

            .sidebar {
                width: 200px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .detalle-grid {
                grid-template-columns: 1fr;
            }

            .contenido {
                padding: 20px;
            }

            table {
                font-size: 13px;
            }

        }

    </style>
</head>

<body>

<!-- BARRA LATERAL -->

<aside class="sidebar">

    <div class="logo">
        SOFTBECX
    </div>

    <ul class="menu">

        <li>
            <a href="/dashboard">
                Dashboard
            </a>
        </li>

        <li>
            <a href="/productos">
                Productos/Servicios
            </a>
        </li>

        <li>
            <a href="/clientes">
                Clientes
            </a>
        </li>

        <li>
            <a href="/pedidos" class="activo">
                Pedidos
            </a>
        </li>

    </ul>

</aside>


<!-- CONTENIDO -->

<main class="contenido">

    <div class="encabezado">

        <h1>Gestión de Pedidos</h1>

        <div class="usuario">
            <span id="nombreUsuario">Usuario</span>
        </div>

    </div>


    <!-- FORMULARIO -->

    <div class="tarjeta">

        <h2 id="tituloFormulario">
            Crear pedido
        </h2>

        <form id="formularioPedido">

            <div class="formulario">

                <div class="campo">

                    <label for="cliente">
                        Cliente
                    </label>

                    <select id="cliente" required>

                        <option value="">
                            Seleccione un cliente
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="producto">
                        Producto
                    </label>

                    <select id="producto" required>

                        <option value="">
                            Seleccione un producto
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="cantidad">
                        Cantidad
                    </label>

                    <input
                            type="number"
                            id="cantidad"
                            min="1"
                            value="1"
                            required
                    >

                </div>


                <div class="campo">

                    <label for="precio">
                        Precio
                    </label>

                    <input
                            type="number"
                            id="precio"
                            readonly
                    >

                </div>


                <div class="campo">

                    <label for="total">
                        Total
                    </label>

                    <input
                            type="number"
                            id="total"
                            readonly
                    >

                </div>


                <div class="campo">

                    <label for="estado">
                        Estado
                    </label>

                    <select id="estado">

                        <option value="Pendiente">
                            Pendiente
                        </option>

                        <option value="Confirmado">
                            Confirmado
                        </option>

                        <option value="Enviado">
                            Enviado
                        </option>

                        <option value="Entregado">
                            Entregado
                        </option>

                    </select>

                </div>

            </div>


            <div class="botones">

                <button
                        type="submit"
                        class="btn-guardar"
                        id="btnGuardar"
                >
                    Guardar pedido
                </button>

                <button
                        type="button"
                        class="btn-cancelar"
                        id="btnCancelar"
                        onclick="cancelarEdicion()"
                        style="display:none;"
                >
                    Cancelar
                </button>

            </div>

        </form>

        <div
                id="mensaje"
                class="mensaje"
        ></div>

    </div>


    <!-- LISTA DE PEDIDOS -->

    <div class="tarjeta">

        <h2>
            Lista de pedidos
        </h2>

        <div class="tabla-contenedor">

            <table>

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Cliente
                    </th>

                    <th>
                        Producto
                    </th>

                    <th>
                        Cantidad
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>

                </thead>

                <tbody id="tablaPedidos">

                </tbody>

            </table>

        </div>

    </div>


    <!-- DETALLE DEL PEDIDO -->

    <div
            class="tarjeta"
            id="tarjetaDetalle"
            style="display:none;"
    >

        <h2>
            Detalle del pedido
        </h2>

        <div
                id="detallePedido"
                class="detalle-pedido"
                style="display:block;"
        >

            <div class="detalle-grid">

                <div class="detalle-item">

                    <strong>
                        Pedido
                    </strong>

                    <span id="detalleId">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Cliente
                    </strong>

                    <span id="detalleCliente">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Documento
                    </strong>

                    <span id="detalleDocumento">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Correo
                    </strong>

                    <span id="detalleCorreo">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Producto
                    </strong>

                    <span id="detalleProducto">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Categoría
                    </strong>

                    <span id="detalleCategoria">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Cantidad
                    </strong>

                    <span id="detalleCantidad">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Precio
                    </strong>

                    <span id="detallePrecio">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Total
                    </strong>

                    <span id="detalleTotal">
                    </span>

                </div>


                <div class="detalle-item">

                    <strong>
                        Estado
                    </strong>

                    <span id="detalleEstado">
                    </span>

                </div>

            </div>

        </div>

    </div>

</main>


<script>

    const token = localStorage.getItem("token");

    const usuarioGuardado =
        localStorage.getItem("usuario");


    // ============================
    // MOSTRAR USUARIO
    // ============================

    if (usuarioGuardado) {

        const usuario =
            JSON.parse(usuarioGuardado);

        document.getElementById("nombreUsuario")
            .textContent = usuario.nombre;

    }


    let pedidos = [];

    let clientes = [];

    let productos = [];

    let pedidoEditando = null;


    // ============================
    // CARGAR CLIENTES
    // ============================

    async function cargarClientes() {

        try {

            const respuesta =
                await fetch("/api/clientes", {

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }

                });


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudieron cargar los clientes"
                );

            }


            clientes =
                await respuesta.json();


            const select =
                document.getElementById("cliente");


            select.innerHTML =
                '<option value="">Seleccione un cliente</option>';


            clientes.forEach(cliente => {

                const option =
                    document.createElement("option");

                option.value =
                    cliente.id;

                option.textContent =
                    cliente.nombre;

                select.appendChild(option);

            });

        } catch (error) {

            console.error(error);

        }

    }


    // ============================
    // CARGAR PRODUCTOS
    // ============================

    async function cargarProductos() {

        try {

            const respuesta =
                await fetch("/api/productos", {

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }

                });


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudieron cargar los productos"
                );

            }


            productos =
                await respuesta.json();


            const select =
                document.getElementById("producto");


            select.innerHTML =
                '<option value="">Seleccione un producto</option>';


            productos.forEach(producto => {

                const option =
                    document.createElement("option");

                option.value =
                    producto.id;

                option.textContent =
                    producto.nombre;

                select.appendChild(option);

            });

        } catch (error) {

            console.error(error);

        }

    }


    // ============================
    // ACTUALIZAR PRECIO
    // ============================

    document.getElementById("producto")
        .addEventListener(
            "change",
            function () {

                const productoId =
                    parseInt(this.value);


                const producto =
                    productos.find(
                        p => p.id === productoId
                    );


                if (producto) {

                    document.getElementById("precio")
                        .value =
                        producto.precio;

                    calcularTotal();

                } else {

                    document.getElementById("precio")
                        .value = "";

                    document.getElementById("total")
                        .value = "";

                }

            }
        );


    // ============================
    // CALCULAR TOTAL
    // ============================

    document.getElementById("cantidad")
        .addEventListener(
            "input",
            calcularTotal
        );


    function calcularTotal() {

        const cantidad =
            Number(
                document.getElementById("cantidad")
                    .value
            );


        const precio =
            Number(
                document.getElementById("precio")
                    .value
            );


        const total =
            cantidad * precio;


        document.getElementById("total")
            .value =
            total;

    }


    // ============================
    // GUARDAR PEDIDO
    // ============================

    document.getElementById("formularioPedido")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const clienteId =
                    Number(
                        document.getElementById("cliente")
                            .value
                    );


                const productoId =
                    Number(
                        document.getElementById("producto")
                            .value
                    );


                const cantidad =
                    Number(
                        document.getElementById("cantidad")
                            .value
                    );


                const precio =
                    Number(
                        document.getElementById("precio")
                            .value
                    );


                const total =
                    Number(
                        document.getElementById("total")
                            .value
                    );


                const estado =
                    document.getElementById("estado")
                        .value;


                const mensaje =
                    document.getElementById("mensaje");


                try {

                    // ==========================
                    // CREAR PEDIDO
                    // ==========================

                    if (pedidoEditando === null) {

                        const respuestaPedido =
                            await fetch(
                                "/api/pedidos",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify({

                                            cliente: {
                                                id: clienteId
                                            },

                                            total:
                                            total,

                                            estado:
                                            estado

                                        })

                                }
                            );


                        if (!respuestaPedido.ok) {

                            throw new Error(
                                "No se pudo crear el pedido"
                            );

                        }


                        const pedido =
                            await respuestaPedido.json();


                        // ==========================
                        // CREAR DETALLE
                        // ==========================

                        const respuestaDetalle =
                            await fetch(
                                "/api/detalles-pedido",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify({

                                            pedido: {
                                                id: pedido.id
                                            },

                                            producto: {
                                                id: productoId
                                            },

                                            cantidad:
                                            cantidad,

                                            precio:
                                            precio

                                        })

                                }
                            );


                        if (!respuestaDetalle.ok) {

                            throw new Error(
                                "El pedido se creó, pero hubo un error al guardar el detalle"
                            );

                        }


                        mensaje.textContent =
                            "Pedido creado correctamente";

                    }


                        // ==========================
                        // EDITAR PEDIDO
                    // ==========================

                    else {

                        const respuesta =
                            await fetch(
                                "/api/pedidos/" +
                                pedidoEditando,
                                {

                                    method: "PUT",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify({

                                            cliente: {
                                                id: clienteId
                                            },

                                            total:
                                            total,

                                            estado:
                                            estado

                                        })

                                }
                            );


                        if (!respuesta.ok) {

                            throw new Error(
                                "No se pudo actualizar el pedido"
                            );

                        }


                        mensaje.textContent =
                            "Pedido actualizado correctamente";

                    }


                    limpiarFormulario();

                    cargarPedidos();

                } catch (error) {

                    console.error(error);

                    mensaje.textContent =
                        error.message;

                }

            }
        );


    // ============================
    // CARGAR PEDIDOS
    // ============================

    async function cargarPedidos() {

        try {

            const respuesta =
                await fetch(
                    "/api/pedidos",
                    {

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudieron cargar los pedidos"
                );

            }


            pedidos =
                await respuesta.json();


            await cargarDetallesDePedidos();

        } catch (error) {

            console.error(error);

        }

    }


    // ============================
    // CARGAR DETALLES
    // ============================

    async function cargarDetallesDePedidos() {

        for (const pedido of pedidos) {

            try {

                const respuesta =
                    await fetch(
                        "/api/detalles-pedido/pedido/" +
                        pedido.id,
                        {

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (respuesta.ok) {

                    pedido.detalles =
                        await respuesta.json();

                } else {

                    pedido.detalles = [];

                }

            } catch (error) {

                console.error(error);

                pedido.detalles = [];

            }

        }


        mostrarPedidos();

    }


    // ============================
    // MOSTRAR PEDIDOS
    // ============================

    function mostrarPedidos() {

        const tabla =
            document.getElementById("tablaPedidos");


        tabla.innerHTML = "";


        pedidos.forEach(pedido => {

            const fila =
                document.createElement("tr");


            const cliente =
                pedido.cliente
                    ? pedido.cliente.nombre
                    : "Sin cliente";


            let producto =
                "Sin producto";


            let cantidad =
                "-";


            if (
                pedido.detalles &&
                pedido.detalles.length > 0
            ) {

                const detalle =
                    pedido.detalles[0];


                if (detalle.producto) {

                    producto =
                        detalle.producto.nombre;

                }


                cantidad =
                    detalle.cantidad;

            }


            let claseEstado =
                pedido.estado
                    .toLowerCase()
                    .replace(" ", "");


            fila.innerHTML = `

                <td>
                    ${pedido.id}
                </td>

                <td>
                    ${cliente}
                </td>

                <td>
                    ${producto}
                </td>

                <td>
                    ${cantidad}
                </td>

                <td>
                    $${Number(pedido.total)
                .toLocaleString("es-CO")}
                </td>

                <td>

                    <span class="estado ${claseEstado}">
                        ${pedido.estado}
                    </span>

                </td>

                <td class="acciones">

                    <button
                            class="btn-editar"
                            onclick="editarPedido(${pedido.id})"
                    >
                        Editar
                    </button>

                    <button
                            class="btn-ver"
                            onclick="verDetalle(${pedido.id})"
                    >
                        Ver detalles
                    </button>

                    <button
                            class="btn-eliminar"
                            onclick="eliminarPedido(${pedido.id})"
                    >
                        Eliminar
                    </button>

                </td>

            `;


            tabla.appendChild(fila);

        });

    }


    // ============================
    // VER DETALLE
    // ============================

    async function verDetalle(id) {

        try {

            const respuesta =
                await fetch(
                    "/api/detalles-pedido/pedido/" +
                    id,
                    {

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo consultar el detalle"
                );

            }


            const detalles =
                await respuesta.json();


            if (
                !detalles ||
                detalles.length === 0
            ) {

                alert(
                    "Este pedido no tiene detalles."
                );

                return;

            }


            const detalle =
                detalles[0];


            const pedido =
                detalle.pedido;


            const producto =
                detalle.producto;


            document.getElementById("detalleId")
                .textContent =
                pedido.id;


            document.getElementById("detalleCliente")
                .textContent =
                pedido.cliente
                    ? pedido.cliente.nombre
                    : "Sin cliente";


            document.getElementById("detalleDocumento")
                .textContent =
                pedido.cliente
                    ? pedido.cliente.documento
                    : "Sin documento";


            document.getElementById("detalleCorreo")
                .textContent =
                pedido.cliente
                    ? pedido.cliente.correo
                    : "Sin correo";


            document.getElementById("detalleProducto")
                .textContent =
                producto
                    ? producto.nombre
                    : "Sin producto";


            document.getElementById("detalleCategoria")
                .textContent =
                producto
                    ? producto.categoria
                    : "Sin categoría";


            document.getElementById("detalleCantidad")
                .textContent =
                detalle.cantidad;


            document.getElementById("detallePrecio")
                .textContent =
                "$" +
                Number(detalle.precio)
                    .toLocaleString("es-CO");


            document.getElementById("detalleTotal")
                .textContent =
                "$" +
                Number(pedido.total)
                    .toLocaleString("es-CO");


            document.getElementById("detalleEstado")
                .textContent =
                pedido.estado;


            document.getElementById("tarjetaDetalle")
                .style.display =
                "block";


            document.getElementById("tarjetaDetalle")
                .scrollIntoView({
                    behavior: "smooth"
                });


        } catch (error) {

            console.error(error);

            alert(
                error.message
            );

        }

    }


    // ============================
    // EDITAR
    // ============================

    function editarPedido(id) {

        const pedido =
            pedidos.find(
                p => p.id === id
            );


        if (!pedido) {

            return;

        }


        pedidoEditando =
            id;


        document.getElementById("cliente")
            .value =
            pedido.cliente.id;


        document.getElementById("estado")
            .value =
            pedido.estado;


        if (
            pedido.detalles &&
            pedido.detalles.length > 0
        ) {

            const detalle =
                pedido.detalles[0];


            if (detalle.producto) {

                document.getElementById("producto")
                    .value =
                    detalle.producto.id;

            }


            document.getElementById("cantidad")
                .value =
                detalle.cantidad;


            document.getElementById("precio")
                .value =
                detalle.precio;


            document.getElementById("total")
                .value =
                pedido.total;

        }


        document.getElementById("tituloFormulario")
            .textContent =
            "Editar pedido";


        document.getElementById("btnGuardar")
            .textContent =
            "Actualizar pedido";


        document.getElementById("btnCancelar")
            .style.display =
            "inline-block";

    }


    // ============================
    // ELIMINAR
    // ============================

    async function eliminarPedido(id) {

        const confirmar =
            confirm(
                "¿Está seguro de eliminar este pedido?"
            );


        if (!confirmar) {

            return;

        }


        try {

            const respuesta =
                await fetch(
                    "/api/pedidos/" + id,
                    {

                        method: "DELETE",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }
                );


            if (!respuesta.ok) {

                throw new Error(
                    "No se pudo eliminar el pedido"
                );

            }


            document.getElementById("tarjetaDetalle")
                .style.display =
                "none";


            cargarPedidos();

        } catch (error) {

            console.error(error);

            alert(
                error.message
            );

        }

    }


    // ============================
    // CANCELAR EDICIÓN
    // ============================

    function cancelarEdicion() {

        pedidoEditando =
            null;

        limpiarFormulario();

    }


    // ============================
    // LIMPIAR FORMULARIO
    // ============================

    function limpiarFormulario() {

        document.getElementById("formularioPedido")
            .reset();


        document.getElementById("cantidad")
            .value =
            1;


        document.getElementById("precio")
            .value =
            "";


        document.getElementById("total")
            .value =
            "";


        document.getElementById("tituloFormulario")
            .textContent =
            "Crear pedido";


        document.getElementById("btnGuardar")
            .textContent =
            "Guardar pedido";


        document.getElementById("btnCancelar")
            .style.display =
            "none";


        pedidoEditando =
            null;

    }


    // ============================
    // INICIAR PÁGINA
    // ============================

    cargarClientes();

    cargarProductos();

    cargarPedidos();

</script>

</body>
</html>
