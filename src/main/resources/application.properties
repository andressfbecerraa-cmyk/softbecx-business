spring.application.name=softbecx

# ==========================================
# CONEXIÓN A MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/softbecx_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true